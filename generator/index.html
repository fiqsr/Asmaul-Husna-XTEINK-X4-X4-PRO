      --md-outline-variant: #3f4944;
      font-family: Roboto, system-ui, sans-serif;
      color: var(--md-on-surface);
      background: var(--md-surface);

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 60px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--md-outline-variant);

    .app-bar p { margin: 0; color: var(--md-on-surface-variant); font-size: 0.85rem; }
    
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 61px);
    }
    .pane-list {
      border-right: 1px solid var(--md-outline-variant);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .search-wrap { padding: 12px 16px; }
    input[type="search"] {
      width: 100%;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--md-outline);
      border-radius: 4px;
      background: var(--md-surface-container);
      color: var(--md-on-surface);
      font: inherit;
    }
    .validasi {
      margin: 0 16px 12px;
      font-size: 0.8rem;
      color: var(--md-primary);
    }
    .asma-list {
      list-style: none;
      margin: 0;
      padding: 0 8px 16px;
      overflow-y: auto;
      flex: 1;
    }
    .asma-item {
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }
    .asma-item:hover { background: var(--md-surface-container-high); }
    .asma-item.active { background: var(--md-primary-container); color: var(--md-on-primary-container); }
    .asma-item .urutan { font-weight: bold; width: 30px; font-size: 0.85rem; color: var(--md-primary); }
    .asma-item.active .urutan { color: #ffffff; }
    .asma-item .latin { font-weight: 500; font-size: 0.9rem; flex: 1; font-family: 'Lato', sans-serif; }
    .asma-item .arab { font-family: 'Amiri', serif; font-size: 1.2rem; direction: rtl; }

    .pane-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
      background: #0a0a0a;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    .btn {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--md-primary); color: var(--md-on-primary); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .export-btn {
      background: #2b7a53;
      color: #fff;
      font-size: 1rem;
      padding: 8px 24px;
    }
    .export-btn:hover { background: #359465; }

    .screen-frame {
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 3px solid #333;
      border-radius: 6px;
      background: #ffffff;
      line-height: 0;
    }
    canvas {
      display: block;
      width: 480px;
      height: 800px;
    }
  </style>
</head>

      // Item 0: Cover
      const liCover = document.createElement("li");
      liCover.className = "asma-item" + (currentPage === 0 ? " active" : "");
      liCover.innerHTML = '<span class="urutan">00</span><span class="latin">Sampul / Cover</span><span class="arab">الأسماء</span>';
      liCover.onclick = () => {
        currentPage = 0;
        renderList();
        renderPage(0);
      };
      listEl.appendChild(liCover);

      // Item 1: Info & QR
      const liInfo = document.createElement("li");
      liInfo.className = "asma-item" + (currentPage === 1 ? " active" : "");
      liInfo.innerHTML = '<span class="urutan">01</span><span class="latin">Informasi &amp; Sumber</span><span class="arab">QR</span>';
      liInfo.onclick = () => {
        currentPage = 1;
        renderList();
        renderPage(1);
      };
      listEl.appendChild(liInfo);

      asmaData.forEach((item) => {
        if (search && !item.latin.toLowerCase().includes(search) && !item.arti.toLowerCase().includes(search) && !item.arab.includes(search)) {
          return;
        }
        const itemPage = Math.floor((item.urutan - 1) / 3) + 2;
        const li = document.createElement("li");
        li.className = "asma-item" + (currentPage === itemPage ? " active" : "");
        li.innerHTML = `<span class="urutan">${item.urutan}</span><span class="latin">${item.latin}</span><span class="arab">${item.arab}</span>`;
        li.onclick = () => {
          currentPage = itemPage;
          renderList();
          renderPage(currentPage);
        };
        listEl.appendChild(li);
      });

      // Item Penutup (Page 35)
      const liPenutup = document.createElement("li");
      liPenutup.className = "asma-item" + (currentPage === 35 ? " active" : "");
      liPenutup.innerHTML = '<span class="urutan">36</span><span class="latin">Penutup (QS. Al-A\'raf: 180)</span><span class="arab">وَلِلَّهِ</span>';
      liPenutup.onclick = () => {
        currentPage = 35;
        renderList();
        renderPage(35);
      };
      listEl.appendChild(liPenutup);
    }

    document.getElementById("searchInput").oninput = renderList;

    function renderPage(pageNum) {
      document.getElementById("pageIndicator").textContent = `Halaman ${pageNum + 1} / ${totalPages}`;
      document.getElementById("btnPrev").disabled = pageNum === 0;
      document.getElementById("btnNext").disabled = pageNum === totalPages - 1;

      // Pure white canvas background
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, 480, 800);
      ctx.fillStyle = "#000000";

      if (pageNum === 0) {
        renderCover();
      } else if (pageNum === 1) {
        renderInfoPage();
      } else if (pageNum === 35) {
        renderPenutup();
      } else {
        renderContent(pageNum);
      }
    }

    function renderCover() {
      const rightX = 424; // Reference right axis matching Andi's cover
      ctx.textBaseline = "top";
      ctx.textAlign = "right";
      ctx.fillStyle = "#000000";

      // 1. Arabic Title (Safe font size 40px with auto-fit check so it never gets clipped on left)
      let arabicSize = 40;
      ctx.font = "bold " + arabicSize + "px Tahoma, 'Noto Kufi Arabic', sans-serif";
      while (ctx.measureText("الأسماء الحسنى").width > (rightX - 44) && arabicSize > 24) {
        arabicSize -= 1;
        ctx.font = "bold " + arabicSize + "px Tahoma, 'Noto Kufi Arabic', sans-serif";
      }
      ctx.fillText("الأسماء الحسنى", rightX, 220);

      // 2. Title: right-aligned, Y = 360
      ctx.font = "bold 38px 'Roboto', sans-serif";
      ctx.fillText("Asma'ul Husna", rightX, 360);

      // 3. Subtitle: right-aligned, Y = 412 (regular, not bold, matching Andi's Sapi subtitle)
      ctx.font = "300 24px 'Roboto', sans-serif";
      ctx.fillText("99 Nama-Nama Agung Allah", rightX, 412);

      // 4. Metadata block with fiqsr info: right-aligned, Y = 550+
      ctx.font = "bold 18px 'Roboto', sans-serif";
      ctx.fillText("99 Asma • Teks Arab, Latin & Arti", rightX, 550);

      ctx.font = "16px 'Roboto', sans-serif";
      ctx.fillStyle = "#1a1a1a";
      ctx.fillText("Edisi Khusus Xteink X4 & X4 Pro", rightX, 584);
      ctx.fillText("Disusun oleh: fiqsr", rightX, 608);
      ctx.fillText("github.com/fiqsr", rightX, 632);
      ctx.fillText("v 1.0 - 2026", rightX, 656);
    }

    function renderInfoPage() {
      ctx.textBaseline = "top";
      ctx.textAlign = "center";
      ctx.fillStyle = "#000000";

      // Header (Prominent & Clear)
      ctx.font = "bold 26px 'Roboto', sans-serif";
      ctx.fillText("Informasi Proyek", 240, 38);

      ctx.font = "16px 'Roboto', sans-serif";
      ctx.fillStyle = "#222222";
      ctx.fillText("Asma'ul Husna • Xteink X4 & X4 Pro", 240, 72);

      // 1px solid black divider
      ctx.beginPath();
      ctx.moveTo(32, 100);
      ctx.lineTo(448, 100);
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1;
      ctx.stroke();

      // Simplified and enlarged info block
      let curY = 120;
      const items = [
        ["Penyusun & Repositori", "fiqsr  •  github.com/fiqsr"],
        ["Format & Arsitektur .XTC", "andidewanto/xteink-x4-quran-indonesia"],
        ["Sumber Data Asma'ul Husna", "haikelz/asmaul-husna-api"],
        ["Kaligrafi Arab", "Amiri Typeface (SIL OFL)"]
      ];

      ctx.textAlign = "left";
      for (const [label, val] of items) {
        ctx.font = "bold 17px 'Roboto', sans-serif";
        ctx.fillStyle = "#000000";
        ctx.fillText(label, 36, curY);
        curY += 23;

        ctx.font = "17px 'Lato', sans-serif";
        ctx.fillStyle = "#111111";
        ctx.fillText(val, 48, curY);
        curY += 28;
      }

      // 1px divider
      ctx.beginPath();
      ctx.moveTo(32, curY + 6);
      ctx.lineTo(448, curY + 6);
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1;
      ctx.stroke();
      curY += 22;

      // QR Code
      const qrSize = 180;
      const qrX = (480 - qrSize) / 2;
      const qrY = curY;
      if (qrImage.complete) {
        ctx.drawImage(qrImage, qrX, qrY, qrSize, qrSize);
      } else {
        qrImage.onload = () => {
          if (currentPage === 1) renderInfoPage();
        };
      }

      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1;
      ctx.strokeRect(qrX - 2, qrY - 2, qrSize + 4, qrSize + 4);

      curY += qrSize + 16;

      ctx.textAlign = "center";
      ctx.fillStyle = "#000000";
      ctx.font = "bold 16px 'Roboto', sans-serif";
      ctx.fillText("Pindai QR Code untuk Membuka Repositori:", 240, curY);
      curY += 22;

      ctx.font = "15px 'Lato', sans-serif";
      ctx.fillStyle = "#222222";
      ctx.fillText("github.com/fiqsr/Asmaul-Husna-XTEINK-X4-X4-PRO", 240, curY);

      // Bottom footer
      ctx.font = "15px 'Roboto', sans-serif";
      ctx.fillStyle = "#333333";
      ctx.fillText("Xteink X4 & X4 Pro E-Reader Edition • 2026", 240, 764);
    }

    function renderContent(pageNum) {
      const asmaPageNum = pageNum - 1; // Page 2 is Asma 1-3 (page_num 1)
      const startIdx = (asmaPageNum - 1) * 3;
      const chunk = asmaData.slice(startIdx, startIdx + 3);
      const slotTops = [16, 260, 504];
      const slotH = 244;

      chunk.forEach((item, i) => {
        const sy = slotTops[i];

        // 1. Asma No (Centered, Roboto 500 16px, matching Andi's Ayat 1/7 style)
        ctx.textBaseline = "top";
        ctx.textAlign = "center";
        ctx.font = "500 16px 'Roboto', sans-serif";
        ctx.fillStyle = "#1a1a1a";
        ctx.fillText(`ASMA ${item.urutan} / 99`, 240, sy + 14);

        // 2. Arabic with Full Harakat (Amiri REGULAR 48px, crisp natural strokes, FIXED baseline: sy + 96)
        ctx.textBaseline = "alphabetic";
        ctx.font = "48px 'Amiri', serif";
        ctx.fillStyle = "#000000";
        ctx.direction = "rtl";
        ctx.fillText(item.arab, 240, sy + 96);
        ctx.direction = "ltr";

        // 3. Latin Name (Centered, Lato Bold 25px)
        ctx.textBaseline = "top";
        ctx.font = "bold 25px 'Lato', sans-serif";
        ctx.fillStyle = "#000000";
        ctx.fillText(item.latin, 240, sy + 134);

        // 4. Arti / Translation (Centered, 24px regular, NOT bold, matching 99 Nama-Nama Agung Allah)
        ctx.font = "24px 'Roboto', sans-serif";
        ctx.fillStyle = "#1a1a1a";
        const cleanArti = item.arti.replace(/([^\s])\(/g, "$1 (");
        const words = cleanArti.split(" ");
        const artiLines = [];
        let curLine = "";
        for (const w of words) {
          const testLine = (curLine + " " + w).trim();
          if (ctx.measureText(testLine).width <= 420) {
            curLine = testLine;
          } else {
            if (curLine) artiLines.push(curLine);
            curLine = w;
          }
        }
        if (curLine) artiLines.push(curLine);

        const startArtiY = artiLines.length === 1 ? sy + 178 : sy + 168;
        artiLines.forEach((line, idx) => {
          ctx.fillText(line, 240, startArtiY + idx * 30);
        });

        // Divider line between cards: 1px solid black line
        if (i < 2) {
          ctx.beginPath();
          ctx.moveTo(32, sy + slotH);
          ctx.lineTo(480 - 32, sy + slotH);
          ctx.strokeStyle = "#000000";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      });

      // Page number at bottom (Centered, Roboto 500 18px, matching Andi's 1/5 style)
      ctx.textBaseline = "top";
      ctx.textAlign = "center";
      ctx.font = "500 18px 'Roboto', sans-serif";
      ctx.fillStyle = "#000000";
      ctx.fillText(`${asmaPageNum} / 33`, 240, 764);
    }

    function renderPenutup() {
      ctx.textAlign = "center";
      ctx.fillStyle = "#000000";

      // Centered Ayat Quran
      ctx.textBaseline = "alphabetic";
      ctx.font = "40px 'Amiri', serif";
      ctx.direction = "rtl";
      ctx.fillText("وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا", 240, 290);
      ctx.direction = "ltr";

      // 1px solid Divider line
      ctx.beginPath();
      ctx.moveTo(160, 330);
      ctx.lineTo(320, 330);
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1;
      ctx.stroke();

      // Translation: Roboto 22px regular (NOT bold)
      ctx.textBaseline = "top";
      ctx.font = "22px 'Roboto', sans-serif";
      const lines = [
        "“Hanya milik Allah asmaaul husna,",
        "maka bermohonlah kepada-Nya",
        "dengan menyebut asmaaul husna itu.”",
        "",
        "QS. Al-A'raf: 180"
      ];
      let curY = 356;
      for (const l of lines) {
        if (l) ctx.fillText(l, 240, curY);
        curY += 28;
      }

      // Bottom notes
      ctx.font = "16px 'Roboto', sans-serif";
      ctx.fillStyle = "#333333";
      const notes = [
        "Asma'ul Husna untuk Xteink X4 & X4 Pro",
        "Disusun oleh fiqsr • github.com/fiqsr",
        "Format Project: andidewanto/xteink-x4-quran-indonesia",
        "Selesai Dibaca • 99 Asma"
      ];
      curY = 640;
      for (const n of notes) {
        ctx.fillText(n, 240, curY);
        curY += 22;
      }
    }

    document.getElementById("btnPrev").onclick = () => {
      if (currentPage > 0) {
        currentPage--;
        renderList();
        renderPage(currentPage);
      }
    };
    document.getElementById("btnNext").onclick = () => {
      if (currentPage < totalPages - 1) {
        currentPage++;
        renderList();
        renderPage(currentPage);
      }
    };

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" && currentPage > 0) {
        currentPage--;
        renderList();
        renderPage(currentPage);
      } else if (e.key === "ArrowRight" && currentPage < totalPages - 1) {
        currentPage++;
        renderList();
        renderPage(currentPage);
      }
    });

    function bitmapXtg(canvasEl) {
      const lebar = 480;
      const tinggi = 800;
      const byteBaris = lebar / 8;
      const data = new Uint8Array(byteBaris * tinggi);
      const px = canvasEl.getContext("2d").getImageData(0, 0, lebar, tinggi).data;
      for (let y = 0; y < tinggi; y++) {
        for (let x = 0; x < lebar; x++) {
          const i = (y * lebar + x) * 4;
          const terang = px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;
          // Threshold 160: exact same as Andi's bitmapXtg
          if (terang >= 160) {
            data[y * byteBaris + (x >> 3)] |= 1 << (7 - (x & 7));
          }
        }
      }
      const header = new Uint8Array(22);
      const view = new DataView(header.buffer);
      header.set([0x58, 0x54, 0x47, 0x00], 0);
      view.setUint16(4, lebar, true);
      view.setUint16(6, tinggi, true);
      view.setUint32(10, data.length, true);
      const blob = new Uint8Array(22 + data.length);
      blob.set(header, 0);
      blob.set(data, 22);
      return blob;
    }

    function bangunXtc(halamanBlobs) {
      const jumlah = halamanBlobs.length;
      const awalIndeks = 56;
      const awalData = awalIndeks + jumlah * 16;
      let ukuran = awalData;
      for (const b of halamanBlobs) ukuran += b.length;

      const file = new Uint8Array(ukuran);
      const view = new DataView(file.buffer);
      file.set([0x58, 0x54, 0x43, 0x00], 0);
      file[4] = 1;
      view.setUint16(6, jumlah, true);
      view.setUint32(12, 1, true);
      view.setBigUint64(24, BigInt(awalIndeks), true);
      view.setBigUint64(32, BigInt(awalData), true);

      let kursor = awalData;
      halamanBlobs.forEach((blob, i) => {
        const entri = awalIndeks + i * 16;
        view.setBigUint64(entri, BigInt(kursor), true);
        view.setUint32(entri + 8, blob.length, true);
        view.setUint16(entri + 12, 480, true);
        view.setUint16(entri + 14, 800, true);
        file.set(blob, kursor);
        kursor += blob.length;
      });
      return file;
    }

    document.getElementById("btnExport").onclick = async () => {
      const btn = document.getElementById("btnExport");
      btn.disabled = true;
      const originalText = btn.textContent;
      const blobs = [];
      const origPage = currentPage;

      for (let p = 0; p < totalPages; p++) {
        btn.textContent = `EXPORT ${p + 1}/${totalPages}`;
        renderPage(p);
        blobs.push(bitmapXtg(canvas));
        await new Promise(r => setTimeout(r, 10));
      }

      const xtcData = bangunXtc(blobs);
      const blob = new Blob([xtcData], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Asmaul-Husna.xtc";
      a.click();
      URL.revokeObjectURL(url);

      btn.disabled = false;
      btn.textContent = originalText;
      currentPage = origPage;
      renderList();
      renderPage(currentPage);
    };

    function init() {
      renderList();
      renderPage(0);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          renderPage(currentPage);
        });
      }
    }

    window.onload = init;
  </script>
