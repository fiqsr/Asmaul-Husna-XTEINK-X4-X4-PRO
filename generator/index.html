<!DOCTYPE html>
<html lang="id">
<head>

  <title>Generator Asma'ul Husna untuk Xteink X4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {

      --md-primary-container: #1b5e4a;
      --md-on-primary-container: #c8efdc;
      --md-surface: #111311;

      --md-on-surface: #e2e3e0;
      --md-on-surface-variant: #c1c9c3;
      --md-outline: #8b938c;
      --md-outline-variant: #3f4944;
      font-family: Roboto, system-ui, sans-serif;
      color: var(--md-on-surface);
      background: var(--md-surface);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 60px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--md-outline-variant);

    .app-bar h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .app-bar p { margin: 0; color: var(--md-on-surface-variant); font-size: 0.85rem; }
    
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 61px);
    }
    .pane-list {
      border-right: 1px solid var(--md-outline-variant);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .search-wrap { padding: 12px 16px; }
    input[type="search"] {
      width: 100%;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--md-outline);
      border-radius: 4px;
      background: var(--md-surface-container);
      color: var(--md-on-surface);
      font: inherit;
    }
    .validasi {
      margin: 0 16px 12px;
      font-size: 0.8rem;
      color: var(--md-primary);
    }
    .asma-list {
      list-style: none;
      margin: 0;
      padding: 0 8px 16px;
      overflow-y: auto;
      flex: 1;
    }
    .asma-item {
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }
    .asma-item:hover { background: var(--md-surface-container-high); }
    .asma-item.active { background: var(--md-primary-container); color: var(--md-on-primary-container); }
    .asma-item .urutan { font-weight: bold; width: 30px; font-size: 0.85rem; color: var(--md-primary); }
    .asma-item.active .urutan { color: #ffffff; }
    .asma-item .latin { font-weight: 500; font-size: 0.9rem; flex: 1; }
    .asma-item .arab { font-family: 'Amiri', serif; font-size: 1.2rem; direction: rtl; }

    .pane-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
      background: #0a0a0a;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    .btn {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--md-primary); color: var(--md-on-primary); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .export-btn {
      background: #2b7a53;
      color: #fff;
      font-size: 1rem;
      padding: 8px 24px;
    }
    .export-btn:hover { background: #359465; }

    .screen-frame {
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 3px solid #333;
      border-radius: 6px;
      background: #ffffff;
      line-height: 0;
    }
    canvas {
      display: block;
      width: 480px;
      height: 800px;
    }
  </style>
</head>

      <div class="screen-frame">

  <script>

arab": "الْقَيُّومُ", "arti": "Yang Maha Mandiri"}, {"urutan": 64, "latin": "Al Waajid", "arab": "الْوَاجِدُ", "arti": "Yang Maha Penemu"}, {"urutan": 65, "latin": "Al Maajid", "arab": "الْمَاجِدُ", "arti": "Yang Maha Mulia"}, {"urutan": 66, "latin": "Al Wahiid", "arab": "الْواحِدُ", "arti": "Yang Maha Tunggal"}, {"urutan": 67, "latin": "Al Ahad", "arab": "اَلاَحَدُ", "arti": "Yang Maha Esa"}, {"urutan": 68, "latin": "As Shamad", "arab": "الصَّمَدُ", "arti": "Yang Maha Dibutuhkan, Tempat Meminta"}, {"urutan": 69, "latin": "Al Qaadir", "arab": "الْقَادِرُ", "arti": "Yang Maha Menentukan, Maha Menyeimbangkan"}, {"urutan": 70, "latin": "Al Muqtadir", "arab": "الْمُقْتَدِرُ", "arti": "Yang Maha Berkuasa"}, {"urutan": 71, "latin": "Al Muqaddim", "arab": "الْمُقَدِّمُ", "arti": "Yang Maha Mendahulukan"}, {"urutan": 72, "latin": "Al Mu 'akkhir", "arab": "الْمُؤَخِّرُ", "arti": "Yang Maha Mengakhirkan"}, {"urutan": 73, "latin": "Al Awwal", "arab": "الأوَّلُ", "arti": "Yang Maha Awal"}, {"urutan": 74, "latin": "Al Aakhir", "arab": "الآخِرُ", "arti": "Yang Maha Akhir"}, {"urutan": 75, "latin": "Az Zhaahir", "arab": "الظَّاهِرُ", "arti": "Yang Maha Nyata"}, {"urutan": 76, "latin": "Al Baathin", "arab": "الْبَاطِنُ", "arti": "Yang Maha Ghaib"}, {"urutan": 77, "latin": "Al Waali", "arab": "الْوَالِي", "arti": "Yang Maha Memerintah"}, {"urutan": 78, "latin": "Al Muta'aalii", "arab": "الْمُتَعَالِي", "arti": "Yang Maha Tinggi"}, {"urutan": 79, "latin": "Al Barru", "arab": "الْبَرُّ", "arti": "Yang Maha Penderma(Maha Pemberi Kebajikan)"}, {"urutan": 80, "latin": "At Tawwaab", "arab": "التَّوَّابُ", "arti": "Yang Maha Penerima Tobat"}, {"urutan": 81, "latin": "Al Muntaqim", "arab": "الْمُنْتَقِمُ", "arti": "Yang Maha Pemberi Balasan"}, {"urutan": 82, "latin": "Al Afuww", "arab": "العَفُوُّ", "arti": "Yang Maha Pemaaf"}, {"urutan": 83, "latin": "Ar Ra 'uuf", "arab": "الرَّؤُوفُ", "arti": "Yang Maha Pengasuh"}, {"urutan": 84, "latin": "Malikul Mulk", "arab": "مَالِكُ الْمُلْكِ", "arti": "Yang Maha Penguasa Kerajaan(Semesta)"}, {"urutan": 85, "latin": "Dzul Jalaali Wal Ikraam", "arab": "ذُوالْجَلاَلِ وَالإكْرَامِ", "arti": "Yang Maha Pemilik Kebesaran dan Kemuliaan"}, {"urutan": 86, "latin": "Al Muqsith", "arab": "الْمُقْسِطُ", "arti": "Yang Maha Pemberi Keadilan"}, {"urutan": 87, "latin": "Al Jamii'", "arab": "الْجَامِعُ", "arti": "Yang Maha Mengumpulkan"}, {"urutan": 88, "latin": "Al Ghaniyy", "arab": "الْغَنِيُّ", "arti": "Yang Maha Kaya"}, {"urutan": 89, "latin": "Al Mughnii", "arab": "الْمُغْنِي", "arti": "Yang Maha Pemberi Kekayaan"}, {"urutan": 90, "latin": "Al Maani", "arab": "اَلْمَانِعُ", "arti": "Yang Maha Mencegah"}, {"urutan": 91, "latin": "Ad Dhaar", "arab": "الضَّارَّ", "arti": "Yang Maha Penimpa Kemudharatan"}, {"urutan": 92, "latin": "An Nafii '", "arab": "النَّافِعُ", "arti": "Yang Maha Memberi Manfaat"}, {"urutan": 93, "latin": "An Nuur", "arab": "النُّورُ", "arti": "Yang Maha Bercahaya(Menerangi, Memberi Cahaya)"}, {"urutan": 94, "latin": "Al Haadii", "arab": "الْهَادِي", "arti": "Yang Maha Pemberi Petunjuk"}, {"urutan": 95, "latin": "Al Badii'", "arab": "الْبَدِيعُ", "arti": "Yang Maha Pencipta Yang Tiada Bandingannya"}, {"urutan": 96, "latin": "Al Baaqii", "arab": "اَلْبَاقِي", "arti": "Yang Maha Kekal"}, {"urutan": 97, "latin": "Al Waarits", "arab": "الْوَارِثُ", "arti": "Yang Maha Pewaris"}, {"urutan": 98, "latin": "Ar Rasyiid", "arab": "الرَّشِيدُ", "arti": "Yang Maha Pandai"}, {"urutan": 99, "latin": "As Shabuur", "arab": "الصَّبُورُ", "arti": "Yang Maha Sabar"}];

    let asmaData = EMBEDDED_ITEMS;
    let currentPage = 0;
    const totalPages = 35;

    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");

    function renderList() {
      const listEl = document.getElementById("asmaList");
      const search = document.getElementById("searchInput").value.toLowerCase();
      listEl.innerHTML = "";

      // Item 0: Cover
      const liCover = document.createElement("li");
      liCover.className = "asma-item" + (currentPage === 0 ? " active" : "");
      liCover.innerHTML = '<span class="urutan">00</span><span class="latin">Sampul / Cover</span><span class="arab">الأسماء</span>';
      liCover.onclick = () => {
        currentPage = 0;
        renderList();
        renderPage(0);
      };
      listEl.appendChild(liCover);

      asmaData.forEach((item) => {
        if (search && !item.latin.toLowerCase().includes(search) && !item.arti.toLowerCase().includes(search) && !item.arab.includes(search)) {
          return;
        }
        const itemPage = Math.floor((item.urutan - 1) / 3) + 1;
        const li = document.createElement("li");
        li.className = "asma-item" + (currentPage === itemPage ? " active" : "");
        li.innerHTML = `<span class="urutan">${item.urutan}</span><span class="latin">${item.latin}</span><span class="arab">${item.arab}</span>`;
        li.onclick = () => {
          currentPage = itemPage;
          renderList();
          renderPage(currentPage);
        };
        listEl.appendChild(li);
      });

      // Item Penutup
      const liPenutup = document.createElement("li");
      liPenutup.className = "asma-item" + (currentPage === 34 ? " active" : "");
      liPenutup.innerHTML = '<span class="urutan">35</span><span class="latin">Penutup (QS. Al-A\'raf: 180)</span><span class="arab">وَلِلَّهِ</span>';
      liPenutup.onclick = () => {
        currentPage = 34;
        renderList();
        renderPage(34);
      };
      listEl.appendChild(liPenutup);
    }

    document.getElementById("searchInput").oninput = renderList;

    function renderPage(pageNum) {
      document.getElementById("pageIndicator").textContent = `Halaman ${pageNum + 1} / ${totalPages}`;
      document.getElementById("btnPrev").disabled = pageNum === 0;
      document.getElementById("btnNext").disabled = pageNum === totalPages - 1;

      // Pure white canvas background
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, 480, 800);
      ctx.fillStyle = "#000000";

      if (pageNum === 0) {
        renderCover();
      } else if (pageNum === 34) {
        renderPenutup();
      } else {
        renderContent(pageNum);
      }
    }

    function renderCover() {
      const rightX = 424; // Reference right axis
      ctx.textBaseline = "top";

      // 1. Arabic: Tahoma Bold, right-aligned to rightX
      ctx.textAlign = "right";
      ctx.fillStyle = "#000000";
      ctx.font = "bold 48px Tahoma, 'Segoe UI', Arial, sans-serif";
      ctx.fillText("الأسماء الحسنى", rightX, 240);

      // 2. Title: right-aligned, Y = 375
      ctx.font = "bold 34px 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("Asma'ul Husna", rightX, 375);

      // 3. Subtitle: right-aligned, Y = 420
      ctx.font = "22px 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("99 Nama-Nama Agung Allah", rightX, 420);

      // 4. Metadata block: right-aligned, Y = 563+
      ctx.font = "bold 16px 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("99 Asma • Teks Arab, Latin & Arti", rightX, 563);

      ctx.font = "13px 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("Sumber Data: Asmaul Husna API", rightX, 594);
      ctx.fillText("Repository: haikelz/asmaul-husna-api", rightX, 614);
      ctx.fillText("Format XTC Khusus Perangkat Xteink X4", rightX, 635);
      ctx.fillText("v 1.0 - 2026", rightX, 656);
    }

    function renderContent(pageNum) {
      const startIdx = (pageNum - 1) * 3;
      const chunk = asmaData.slice(startIdx, startIdx + 3);
      const slots = [
        [16, 260],
        [260, 504],
        [504, 748]
      ];

      chunk.forEach((item, i) => {
        const [sTop, sBottom] = slots[i];
        const sH = sBottom - sTop;

        // Word wrap arti
        const words = item.arti.split(" ");
        const artiLines = [];
        let curLine = "";
        for (const w of words) {
          if ((curLine + " " + w).trim().length <= 36) {
            curLine = (curLine + " " + w).trim();
          } else {
            if (curLine) artiLines.push(curLine);
            curLine = w;
          }
        }
        if (curLine) artiLines.push(curLine);

        // Precise vertical layout:
        // Measure Arabic metrics to strictly prevent harakat overlap
        ctx.font = "50px 'Amiri', serif";
        const mAr = ctx.measureText(item.arab);
        const arAscent = mAr.actualBoundingBoxAscent ? Math.max(mAr.actualBoundingBoxAscent, 48) : 52;
        const arDescent = mAr.actualBoundingBoxDescent ? Math.max(mAr.actualBoundingBoxDescent, 18) : 22;

        const hNo = 14;
        const hLat = 22;
        const lineH = 22;
        const hArtiTotal = artiLines.length * lineH;

        const gapNoAr = 24;   // generous gap between ASMA header and Arabic top harakat
        const gapArLat = 22;  // gap between Arabic bottom and Latin name
        const gapLatArti = 12; // gap between Latin name and Arti

        const totalBlockH = hNo + gapNoAr + (arAscent + arDescent) + gapArLat + hLat + gapLatArti + hArtiTotal;
        const startY = sTop + Math.floor((sH - totalBlockH) / 2);

        // 1. Asma No (Centered)
        ctx.textBaseline = "top";
        ctx.textAlign = "center";
        ctx.font = "13px 'Segoe UI', Roboto, sans-serif";
        ctx.fillStyle = "#555555";
        ctx.fillText(`ASMA ${item.urutan} / 99`, 240, startY);

        // 2. Arabic with FULL HARAKAT (Baseline positioned with arAscent to guarantee NO overlap)
        const arBaselineY = startY + hNo + gapNoAr + arAscent;
        ctx.textBaseline = "alphabetic";
        ctx.font = "50px 'Amiri', serif";
        ctx.fillStyle = "#000000";
        ctx.direction = "rtl";
        ctx.fillText(item.arab, 240, arBaselineY);
        ctx.direction = "ltr";

        // 3. Latin Name (Centered, Bold)
        const latTopY = arBaselineY + arDescent + gapArLat;
        ctx.textBaseline = "top";
        ctx.font = "bold 24px 'Segoe UI', Roboto, sans-serif";
        ctx.fillText(item.latin, 240, latTopY);

        // 4. Arti / Translation (Centered)
        ctx.font = "17px 'Segoe UI', Roboto, sans-serif";
        ctx.fillStyle = "#222222";
        let curArtiY = latTopY + hLat + gapLatArti;
        for (const line of artiLines) {
          ctx.fillText(line, 240, curArtiY);
          curArtiY += lineH;
        }

        // Divider line between cards
        if (i < 2) {
          ctx.beginPath();
          ctx.moveTo(32, sBottom);
          ctx.lineTo(480 - 32, sBottom);
          ctx.strokeStyle = "#888888";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      });

      // Page number at bottom (Centered)
      ctx.textBaseline = "top";
      ctx.textAlign = "center";
      ctx.font = "bold 17px 'Segoe UI', Roboto, sans-serif";
      ctx.fillStyle = "#000000";
      ctx.fillText(String(pageNum), 240, 764);
    }

    function renderPenutup() {
      ctx.textAlign = "center";
      ctx.fillStyle = "#000000";

      // Centered Ayat Quran
      ctx.textBaseline = "alphabetic";
      ctx.font = "38px 'Amiri', serif";
      ctx.direction = "rtl";
      ctx.fillText("وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا", 240, 310);
      ctx.direction = "ltr";

      // Divider line
      ctx.beginPath();
      ctx.moveTo(180, 345);
      ctx.lineTo(300, 345);
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1;
      ctx.stroke();

      // Translation
      ctx.textBaseline = "top";
      ctx.font = "16px 'Segoe UI', Roboto, sans-serif";
      const lines = [
        "“Hanya milik Allah asmaaul husna,",
        "maka bermohonlah kepada-Nya",
        "dengan menyebut asmaaul husna itu.”",
        "",
        "QS. Al-A'raf: 180"
      ];
      let curY = 375;
      for (const l of lines) {
        if (l) ctx.fillText(l, 240, curY);
        curY += 24;
      }

      // Bottom notes
      ctx.font = "13px 'Segoe UI', Roboto, sans-serif";
      ctx.fillStyle = "#555555";
      const notes = [
        "Asma'ul Husna untuk Xteink X4",
        "API: haikelz/asmaul-husna-api",
        "Format Project: andidewanto/xteink-x4-quran-indonesia",
        "Selesai Dibaca • 99 Asma"
      ];
      curY = 650;
      for (const n of notes) {
        ctx.fillText(n, 240, curY);
        curY += 20;
      }
    }

    document.getElementById("btnPrev").onclick = () => {
      if (currentPage > 0) {
        currentPage--;
        renderList();
        renderPage(currentPage);
      }
    };
    document.getElementById("btnNext").onclick = () => {
      if (currentPage < totalPages - 1) {
        currentPage++;
        renderList();
        renderPage(currentPage);
      }
    };

    // Keyboard navigation (ArrowLeft & ArrowRight)
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" && currentPage > 0) {
        currentPage--;
        renderList();
        renderPage(currentPage);
      } else if (e.key === "ArrowRight" && currentPage < totalPages - 1) {
        currentPage++;
        renderList();
        renderPage(currentPage);
      }
    });

    function bitmapXtg(canvasEl) {
      const lebar = 480;
      const tinggi = 800;
      const byteBaris = lebar / 8;
      const data = new Uint8Array(byteBaris * tinggi);
      const px = canvasEl.getContext("2d").getImageData(0, 0, lebar, tinggi).data;
      for (let y = 0; y < tinggi; y++) {
        for (let x = 0; x < lebar; x++) {
          const i = (y * lebar + x) * 4;
          const terang = px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;
          if (terang >= 160) {
            data[y * byteBaris + (x >> 3)] |= 1 << (7 - (x & 7));
          }
        }
      }
      const header = new Uint8Array(22);
      const view = new DataView(header.buffer);
      header.set([0x58, 0x54, 0x47, 0x00], 0);
      view.setUint16(4, lebar, true);
      view.setUint16(6, tinggi, true);
      view.setUint32(10, data.length, true);
      const blob = new Uint8Array(22 + data.length);
      blob.set(header, 0);
      blob.set(data, 22);
      return blob;
    }

    function bangunXtc(halamanBlobs) {
      const jumlah = halamanBlobs.length;
      const awalIndeks = 56;
      const awalData = awalIndeks + jumlah * 16;
      let ukuran = awalData;
      for (const b of halamanBlobs) ukuran += b.length;

      const file = new Uint8Array(ukuran);
      const view = new DataView(file.buffer);
      file.set([0x58, 0x54, 0x43, 0x00], 0);
      file[4] = 1;
      view.setUint16(6, jumlah, true);
      view.setUint32(12, 1, true);
      view.setBigUint64(24, BigInt(awalIndeks), true);
      view.setBigUint64(32, BigInt(awalData), true);

      let kursor = awalData;
      halamanBlobs.forEach((blob, i) => {
        const entri = awalIndeks + i * 16;
        view.setBigUint64(entri, BigInt(kursor), true);
        view.setUint32(entri + 8, blob.length, true);
        view.setUint16(entri + 12, 480, true);
        view.setUint16(entri + 14, 800, true);
        file.set(blob, kursor);
        kursor += blob.length;
      });
      return file;
    }

    document.getElementById("btnExport").onclick = async () => {
      const btn = document.getElementById("btnExport");
      btn.disabled = true;
      const originalText = btn.textContent;
      const blobs = [];
      const origPage = currentPage;

      for (let p = 0; p < totalPages; p++) {
        btn.textContent = `EXPORT ${p + 1}/${totalPages}`;
        renderPage(p);
        blobs.push(bitmapXtg(canvas));
        await new Promise(r => setTimeout(r, 10));
      }

      const xtcData = bangunXtc(blobs);
      const blob = new Blob([xtcData], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Asmaul-Husna.xtc";
      a.click();
      URL.revokeObjectURL(url);

      btn.disabled = false;
      btn.textContent = originalText;
      currentPage = origPage;
      renderList();
      renderPage(currentPage);
    };

    function init() {
      renderList();
      renderPage(0);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          renderPage(currentPage);
        });
      }
    }

    window.onload = init;
  </script>
