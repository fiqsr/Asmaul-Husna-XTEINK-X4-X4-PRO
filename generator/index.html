<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generator Asma'ul Husna untuk Xteink X4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --md-primary: #8fd6b8;
      --md-on-primary: #003828;
      --md-primary-container: #1b5e4a;
      --md-on-primary-container: #c8efdc;
      --md-surface: #111311;
      --md-surface-container: #1c1f1d;
      --md-surface-container-high: #262a27;
      --md-on-surface: #e2e3e0;
      --md-on-surface-variant: #c1c9c3;
      --md-outline: #8b938c;
      --md-outline-variant: #3f4944;
      font-family: Roboto, system-ui, sans-serif;
      color: var(--md-on-surface);
      background: var(--md-surface);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 60px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--md-outline-variant);
    }
    .app-bar h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .app-bar p { margin: 0; color: var(--md-on-surface-variant); font-size: 0.85rem; }
    
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 61px);
    }
    .pane-list {
      border-right: 1px solid var(--md-outline-variant);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .search-wrap { padding: 12px 16px; }
    input[type="search"] {
      width: 100%;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--md-outline);
      border-radius: 4px;
      background: var(--md-surface-container);
      color: var(--md-on-surface);
      font: inherit;
    }
    .validasi {
      margin: 0 16px 12px;
      font-size: 0.8rem;
      color: var(--md-primary);
    }
    .asma-list {
      list-style: none;
      margin: 0;
      padding: 0 8px 16px;
      overflow-y: auto;
      flex: 1;
    }
    .asma-item {
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }
    .asma-item:hover { background: var(--md-surface-container-high); }
    .asma-item .urutan { font-weight: bold; width: 30px; font-size: 0.85rem; color: var(--md-primary); }
    .asma-item .latin { font-weight: 500; font-size: 0.9rem; flex: 1; }
    .asma-item .arab { font-family: 'Amiri', serif; font-size: 1.2rem; direction: rtl; }

    .pane-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
      background: #0a0a0a;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    .btn {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { background: var(--md-primary); color: var(--md-on-primary); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .export-btn {
      background: #2b7a53;
      color: #fff;
      font-size: 1rem;
      padding: 8px 24px;
    }

    .screen-frame {
      width: 480px;
      height: 800px;
      background: #ffffff;
      color: #000000;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    canvas#stage {
      display: block;
      width: 480px;
      height: 800px;
    }
  </style>
</head>
<body>
  <div class="app-bar">
    <div>
      <h1>Generator Asma'ul Husna untuk Xteink X4</h1>
      <p>Berdasarkan spesifikasi format .XTC andidewanto/xteink-x4-quran-indonesia &amp; API haikelz/asmaul-husna-api</p>
    </div>
    <button id="btnExport" class="btn export-btn">EXPORT .XTC</button>
  </div>

  <div class="layout">
    <div class="pane-list">
      <div class="search-wrap">
        <input type="search" id="searchInput" placeholder="Cari nama Latin atau Arab..." />
      </div>
      <div class="validasi">Lengkap &#8226; 99 Asma'ul Husna &#8226; 35 Halaman</div>
      <ul class="asma-list" id="asmaList"></ul>
    </div>

    <div class="pane-preview">
      <div class="toolbar">
        <button id="btnPrev" class="btn">&#8592; Prev</button>
        <span id="pageIndicator" style="font-weight: 500; font-size: 0.95rem;">Halaman 1 / 35</span>
        <button id="btnNext" class="btn">Next &#8594;</button>
      </div>

      <div class="screen-frame">
        <canvas id="stage" width="480" height="800"></canvas>
      </div>
    </div>
  </div>

  <script>
    let asmaData = [];
    let currentPage = 0; // 0 = Cover, 1..33 = Content, 34 = Penutup
    const totalPages = 35;

    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");

    async function loadData() {
      try {
        const resp = await fetch("asmaul_husna.json");
        asmaData = await resp.json();
      } catch (e) {
        console.error("Gagal load json lokal, fetch dari API...", e);
        const resp = await fetch("https://asmaul-husna-api.vercel.app/api/all");
        const json = await resp.json();
        asmaData = json.data;
      }
      renderList();
      renderPage(currentPage);
    }

    function renderList() {
      const listEl = document.getElementById("asmaList");
      const search = document.getElementById("searchInput").value.toLowerCase();
      listEl.innerHTML = "";
      asmaData.forEach((item, idx) => {
        if (search && !item.latin.toLowerCase().includes(search) && !item.arti.toLowerCase().includes(search)) {
          return;
        }
        const li = document.createElement("li");
        li.className = "asma-item";
        li.innerHTML = `<span class="urutan">${item.urutan}</span><span class="latin">${item.latin}</span><span class="arab">${item.arab}</span>`;
        li.onclick = () => {
          currentPage = Math.floor((item.urutan - 1) / 3) + 1;
          renderPage(currentPage);
        };
        listEl.appendChild(li);
      });
    }

    document.getElementById("searchInput").oninput = renderList;

    function renderPage(pageNum) {
      document.getElementById("pageIndicator").textContent = `Halaman ${pageNum + 1} / ${totalPages}`;
      document.getElementById("btnPrev").disabled = pageNum === 0;
      document.getElementById("btnNext").disabled = pageNum === totalPages - 1;

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, 480, 800);
      ctx.fillStyle = "#000000";

      if (pageNum === 0) {
        renderCover();
      } else if (pageNum === 34) {
        renderPenutup();
      } else {
        renderContent(pageNum);
      }
    }

    function renderCover() {
      // 1. Arabic (Centered horizontally, Y = 220)
      ctx.textAlign = "center";
      ctx.font = "bold 54px 'Amiri', Tahoma, serif";
      ctx.fillText("الأسماء الحسنى", 240, 220);

      // 2. Title (Centered, Y = 360)
      ctx.font = "bold 34px Segoe UI, Roboto, sans-serif";
      ctx.fillText("Asma'ul Husna", 240, 360);

      // 3. Subtitle (Centered, Y = 405)
      ctx.font = "20px Segoe UI, Roboto, sans-serif";
      ctx.fillText("99 Nama-Nama Agung Allah", 240, 405);

      // 4. Meta (Right-aligned, right margin 48)
      ctx.textAlign = "right";
      ctx.font = "bold 15px Segoe UI, Roboto, sans-serif";
      ctx.fillText("99 Asma • Teks Arab, Latin & Arti", 480 - 48, 560);

      // 5. Sumber
      ctx.font = "13px Segoe UI, Roboto, sans-serif";
      const lines = [
        "Sumber Data: Asmaul Husna API",
        "Repository: haikelz/asmaul-husna-api",
        "Format XTC Khusus Perangkat Xteink X4",
        "v 1.0 - 2026"
      ];
      lines.forEach((l, idx) => {
        ctx.fillText(l, 480 - 48, 592 + idx * 20);
      });
    }

    function renderContent(pageNum) {
      const startIdx = (pageNum - 1) * 3;
      const chunk = asmaData.slice(startIdx, startIdx + 3);
      const slotStarts = [28, 270, 512];
      const slotHeight = 236;

      chunk.forEach((item, i) => {
        const sy = slotStarts[i];

        // Top divider line if not first
        if (i > 0) {
          ctx.beginPath();
          ctx.moveTo(28, sy - 14);
          ctx.lineTo(480 - 28, sy - 14);
          ctx.strokeStyle = "#000000";
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        // 1. Asma number top right
        ctx.textAlign = "right";
        ctx.font = "14px Segoe UI, Roboto, sans-serif";
        ctx.fillStyle = "#555555";
        ctx.fillText(`Asma ${item.urutan} / 99`, 480 - 28, sy);

        // 2. Arabic text in Amiri font
        ctx.fillStyle = "#000000";
        ctx.font = "50px 'Amiri', serif";
        ctx.fillText(item.arab, 480 - 28, sy + 58);

        // 3. Latin name left aligned
        ctx.textAlign = "left";
        ctx.font = "bold 24px Segoe UI, Roboto, sans-serif";
        ctx.fillText(item.latin, 28, sy + 138);

        // 4. Arti left aligned (with wrap)
        ctx.font = "19px Segoe UI, Roboto, sans-serif";
        const arti = item.arti;
        if (arti.length > 38) {
          const words = arti.split(" ");
          let l1 = "", l2 = "";
          for (const w of words) {
            if ((l1 + " " + w).length <= 36) l1 = (l1 + " " + w).trim();
            else l2 = (l2 + " " + w).trim();
          }
          ctx.fillText(l1, 28, sy + 172);
          ctx.fillText(l2, 28, sy + 196);
        } else {
          ctx.fillText(arti, 28, sy + 172);
        }
      });

      // Bottom page number
      ctx.textAlign = "center";
      ctx.font = "bold 17px Segoe UI, Roboto, sans-serif";
      ctx.fillStyle = "#000000";
      ctx.fillText(String(pageNum), 240, 765);
    }

    function renderPenutup() {
      ctx.textAlign = "center";
      ctx.font = "bold 38px 'Amiri', serif";
      ctx.fillText("وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا", 240, 275);

      ctx.beginPath();
      ctx.moveTo(180, 345);
      ctx.lineTo(300, 345);
      ctx.strokeStyle = "#000000";
      ctx.stroke();

      ctx.font = "16px Segoe UI, Roboto, sans-serif";
      ctx.fillText("“Hanya milik Allah asmaaul husna,", 240, 380);
      ctx.fillText("maka bermohonlah kepada-Nya", 240, 406);
      ctx.fillText("dengan menyebut asmaaul husna itu.”", 240, 432);
      ctx.fillText("— QS. Al-A'raf: 180", 240, 470);

      ctx.font = "13px Segoe UI, Roboto, sans-serif";
      ctx.fillStyle = "#555555";
      ctx.fillText("Asma'ul Husna untuk Xteink X4", 240, 660);
      ctx.fillText("API: haikelz/asmaul-husna-api", 240, 684);
      ctx.fillText("Format: andidewanto/xteink-x4-quran-indonesia", 240, 708);
      ctx.fillText("Selesai Dibaca • 99 Asma", 240, 732);
    }

    document.getElementById("btnPrev").onclick = () => {
      if (currentPage > 0) {
        currentPage--;
        renderPage(currentPage);
      }
    };
    document.getElementById("btnNext").onclick = () => {
      if (currentPage < totalPages - 1) {
        currentPage++;
        renderPage(currentPage);
      }
    };

    function bitmapXtg(canvasEl) {
      const lebar = 480;
      const tinggi = 800;
      const byteBaris = lebar / 8;
      const data = new Uint8Array(byteBaris * tinggi);
      const px = canvasEl.getContext("2d").getImageData(0, 0, lebar, tinggi).data;
      for (let y = 0; y < tinggi; y++) {
        for (let x = 0; x < lebar; x++) {
          const i = (y * lebar + x) * 4;
          const terang = px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;
          if (terang >= 160) {
            data[y * byteBaris + (x >> 3)] |= 1 << (7 - (x & 7));
          }
        }
      }
      const header = new Uint8Array(22);
      const view = new DataView(header.buffer);
      header.set([0x58, 0x54, 0x47, 0x00], 0);
      view.setUint16(4, lebar, true);
      view.setUint16(6, tinggi, true);
      view.setUint32(10, data.length, true);
      const blob = new Uint8Array(22 + data.length);
      blob.set(header, 0);
      blob.set(data, 22);
      return blob;
    }

    function bangunXtc(halamanBlobs) {
      const jumlah = halamanBlobs.length;
      const awalIndeks = 56;
      const awalData = awalIndeks + jumlah * 16;
      let ukuran = awalData;
      for (const b of halamanBlobs) ukuran += b.length;

      const file = new Uint8Array(ukuran);
      const view = new DataView(file.buffer);
      file.set([0x58, 0x54, 0x43, 0x00], 0);
      file[4] = 1;
      view.setUint16(6, jumlah, true);
      view.setUint32(12, 1, true);
      view.setBigUint64(24, BigInt(awalIndeks), true);
      view.setBigUint64(32, BigInt(awalData), true);

      let kursor = awalData;
      halamanBlobs.forEach((blob, i) => {
        const entri = awalIndeks + i * 16;
        view.setBigUint64(entri, BigInt(kursor), true);
        view.setUint32(entri + 8, blob.length, true);
        view.setUint16(entri + 12, 480, true);
        view.setUint16(entri + 14, 800, true);
        file.set(blob, kursor);
        kursor += blob.length;
      });
      return file;
    }

    document.getElementById("btnExport").onclick = async () => {
      const btn = document.getElementById("btnExport");
      btn.disabled = true;
      const originalText = btn.textContent;
      const blobs = [];
      const origPage = currentPage;

      for (let p = 0; p < totalPages; p++) {
        btn.textContent = `EXPORT ${p + 1}/${totalPages}`;
        renderPage(p);
        blobs.push(bitmapXtg(canvas));
        await new Promise(r => setTimeout(r, 10));
      }

      const xtcData = bangunXtc(blobs);
      const blob = new Blob([xtcData], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Asmaul-Husna.xtc";
      a.click();
      URL.revokeObjectURL(url);

      btn.disabled = false;
      btn.textContent = originalText;
      currentPage = origPage;
      renderPage(currentPage);
    };

    window.onload = loadData;
  </script>
</body>
</html>
